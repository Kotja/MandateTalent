name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          # checkout runs `git init`, which warns until the default branch is set.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build:pages
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_INTEREST_ENDPOINT: https://script.google.com/macros/s/AKfycbzip4c7pfrHTQhJ0Kd1zlZVI1RN9TVNSicPJlcXJLE-lCmlWqsrHxJkrcx_ILT0Bq_CLw/exec
          NEXT_PUBLIC_INTEREST_SECRET: "H1i{(OZk#]']Ez(;2N5q!?f!2xT0.DIhB"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          # deploy-pages@v5 still loads the legacy punycode module. Node 24
          # warns, and no newer release has removed that import.
          NODE_OPTIONS: --disable-warning=DEP0040
